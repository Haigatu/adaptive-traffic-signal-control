name: Tests
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m atsc.prepare_demo
      - run: python -m unittest discover -s tests -v
      - run: python -m atsc.compare --headless --warmup 0 --duration 30 --no-browser
